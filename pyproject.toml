[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-agent-api"
version = "0.7.0"
description = "API asincrona con Redis, HITL y observabilidad para un orquestador LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diego Chiang Melendez" }]
dependencies = [
  "arize-phoenix-otel>=0.17,<1",
  "fastapi>=0.162,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-redis>=0.6,<1",
  "openinference-instrumentation-langchain>=0.1.86,<1",
  "opentelemetry-api>=1.38,<2",
  "pinecone>=10.0,<11",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "redis>=8.1,<9",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "fakeredis>=2.32,<3",
  "playwright>=1.55,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
agent-api = "multi_agent_orchestrator.cli:main"
load-test = "multi_agent_orchestrator.load_test:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
